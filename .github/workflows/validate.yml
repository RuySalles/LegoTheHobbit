# Confere os dados do site a cada push e pull request.
# Se algo estiver errado (id apagado, JSON quebrado, ícone faltando...), o check fica vermelho no GitHub.
name: Validar dados

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar data/*.json
        run: python tools/validate.py
