<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="description" content="As 39 conquistas da Steam de LEGO The Hobbit, com dica de como conseguir cada uma, raridade global e checklist com progresso local.">

<meta property="og:url" content="https://ruysalles.github.io/LegoTheHobbit/conquistas.html">

<script src="assets/js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Cinzel:wght@500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/conquistas.css">
</head>
<body>
<header class="topbar" id="topbar"></header>

<main class="wrap">
 <section class="hero">
  <div>
   <div class="eyebrow">Extra · Conquistas da Steam</div>
   <h1><span id="achCount">39</span> conquistas.<br><em>Rumo ao 100%.</em></h1>
   <p class="lede" id="intro"></p>
   <a class="backlink" href="index.html#jornada">← Voltar para a rota dos Red Bricks</a>
  </div>
  <aside class="panel" aria-label="Seu progresso">
   <div class="ring">
    <svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="ringGrad" x1="0" x2="1"><stop offset="0" stop-color="var(--violet)"/><stop offset="1" stop-color="var(--gold)"/></linearGradient></defs><circle class="track" cx="60" cy="60" r="52"/><circle class="fill" id="ringFill" cx="60" cy="60" r="52"/></svg>
    <div class="ring-label"><strong id="ringPct">0%</strong><span id="ringSub">0/0</span></div>
   </div>
   <ul class="rlist">
    <li><span><i class="dot epic"></i>Épicas <small>(&lt;8%)</small></span><b id="r-epic">0/0</b></li>
    <li><span><i class="dot rare"></i>Raras <small>(8–15%)</small></span><b id="r-rare">0/0</b></li>
    <li><span><i class="dot uncommon"></i>Incomuns <small>(15–30%)</small></span><b id="r-uncommon">0/0</b></li>
    <li><span><i class="dot common"></i>Comuns <small>(30%+)</small></span><b id="r-common">0/0</b></li>
   </ul>
   <p class="panel-note" id="panelNote"></p>
  </aside>
 </section>

 <div class="toolbar">
  <div class="segmented" role="group" aria-label="Filtrar conquistas">
   <button type="button" data-filter="all" aria-pressed="true">Todas</button>
   <button type="button" data-filter="pending" aria-pressed="false">Pendentes</button>
   <button type="button" data-filter="done" aria-pressed="false">Concluídas</button>
  </div>
  <label class="search">
   <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
   <input type="search" id="searchInput" placeholder="Buscar conquista ou dica… (ex.: Beorn, mithril, épica)" aria-label="Buscar conquista">
  </label>
  <button class="btn btn-gold" id="continueBtn" type="button">Próxima pendente →</button>
 </div>

<!-- capítulos são montados por assets/js/conquistas.js a partir de data/conquistas.json -->
 <div id="chapters"></div>

 <div class="empty-state" id="emptyState" hidden><strong>Nenhum rastro por aqui.</strong>Nenhuma conquista corresponde à busca ou ao filtro atual.</div>

 <section class="sources">
  <h2>Fontes</h2>
  <ul id="sourceList"></ul>
 </section>
 <footer id="footer"></footer>
</main>

<script type="module" src="assets/js/conquistas.js"></script>
</body>
</html>
