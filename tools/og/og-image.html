<!DOCTYPE html>
<!--
  Fonte da imagem de compartilhamento (og-image.jpg, 1200×630).
  Para regenerar, veja "Imagem de compartilhamento" no README.md.
  Números (tarefas, studs) são lidos de data/rota.json para não ficarem desatualizados.
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@400;500;700&family=Cinzel:wght@600;700&display=block" rel="stylesheet">
<style>
  :root{--bg:#0c100d;--glow-a:#22331f;--glow-b:#3a2a15;--panel:#141a15;--line:#2f3b30;--text:#f0ecdd;--muted:#a9b2a0;--soft:#cdd3c4;
        --gold:#e3b955;--gold2:#f3d892;--brick:#d2442f;--brick-hi:#ec6a52;--brick-lo:#9c2a1b}
  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden;background:var(--bg)}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;color:var(--text);font-family:Alegreya,Georgia,serif;
    background:radial-gradient(ellipse at 6% 0%,var(--glow-a) 0,transparent 560px),radial-gradient(ellipse at 100% 40%,var(--glow-b) 0,transparent 520px),var(--bg);
    padding:62px 70px}
  .card:before{content:"ᚠ";position:absolute;left:520px;top:-60px;font-family:Georgia,serif;font-size:520px;line-height:1;color:#e3b95812}
  .card:after{content:"";position:absolute;inset:18px;border:1px solid #e3b9552a;border-radius:6px}
  .brand{display:flex;align-items:center;gap:16px;font-family:Cinzel,serif;font-weight:700;font-size:22px;letter-spacing:.09em;text-transform:uppercase}
  .mark{width:40px;height:40px;display:grid;place-items:center;border:1.5px solid var(--gold);color:var(--gold);transform:rotate(45deg);border-radius:9px}
  .mark span{transform:rotate(-45deg);font-size:20px}
  .eyebrow{margin-top:46px;display:flex;align-items:center;gap:14px;color:var(--gold);font-weight:700;font-size:19px;letter-spacing:.2em;text-transform:uppercase}
  .eyebrow:before{content:"";width:44px;height:1.5px;background:var(--gold)}
  h1{margin-top:20px;font-family:Cinzel,serif;font-weight:700;font-size:74px;line-height:1.04;filter:drop-shadow(0 4px 0 #0007)}
  h1 em{font-style:normal;color:var(--gold);display:block}
  .sub{margin-top:22px;font-size:27px;color:var(--soft);max-width:600px;line-height:1.3}
  .chips{position:absolute;left:70px;bottom:62px;display:flex;gap:12px}
  .chip{font-size:20px;color:var(--muted);border:1px solid var(--line);background:#141a15d9;border-radius:99px;padding:7px 18px}
  .chip b{color:var(--text)}

  /* Escada de Red Bricks */
  .stairs{position:absolute;right:78px;bottom:70px;width:400px;height:440px}
  .brick{position:absolute;height:58px;border-radius:6px;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:700;font-size:28px;color:#fff;
    text-shadow:0 2px 0 #0007;background:linear-gradient(180deg,var(--brick-hi),var(--brick) 45%,var(--brick-lo));border:2px solid var(--brick-lo);
    box-shadow:0 0 28px #d2442f55,0 10px 18px #0008}
  .brick i{position:absolute;top:-12px;width:30px;height:11px;border-radius:5px 5px 0 0;background:var(--brick-hi);border:2px solid var(--brick-lo);border-bottom:0}
  .brick i:nth-child(1){left:18%}.brick i:nth-child(2){right:18%}
  .brick{grid-auto-flow:column;gap:14px;justify-content:center;align-items:baseline}
  .brick small{font-family:Alegreya,serif;font-weight:700;font-size:21px;opacity:.9;text-shadow:none}
  .studs{position:absolute;right:78px;top:96px;display:flex;gap:7px}
  .stud{width:20px;height:20px;border-radius:50%;background:var(--gold);border:1.5px solid var(--gold2);box-shadow:inset 0 0 0 3px var(--gold),inset 0 0 0 4.5px #f7e7b5}
  .stud.off{background:var(--panel);border-color:var(--line);box-shadow:inset 0 0 0 3px var(--panel),inset 0 0 0 4.5px var(--line)}
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="mark"><span>✦</span></span>Middle-earth Field Guide</div>
  <div class="eyebrow">LEGO The Hobbit · Rota de progressão</div>
  <h1>Uma jornada.<em>Menos desvios.</em></h1>
  <p class="sub">Esquema, forja e entrega: a ordem certa para liberar todos os Red Bricks de studs.</p>
  <div class="chips">
    <span class="chip"><b id="cMult">5</b> multiplicadores</span>
    <span class="chip"><b id="cStuds">36,5M</b> studs</span>
    <span class="chip"><b id="cTasks">35</b> tarefas</span>
  </div>
  <div class="studs" id="studRow"></div>
  <div class="stairs" id="stairs"></div>
</div>
<script>
  // Escada: um degrau por multiplicador, do x2 (embaixo, à esquerda) ao x10 (em cima, à direita)
  const steps = [['x2', '500 mil'], ['x4', '1,5M'], ['x6', '4,5M'], ['x8', '10M'], ['x10', '20M']];
  const stairs = document.getElementById('stairs');
  steps.forEach(([label, cost], i) => {
    const b = document.createElement('div');
    b.className = 'brick';
    const w = 190 + i * 30;
    b.style.cssText = `width:${w}px;right:${(4 - i) * 46}px;bottom:${i * 84}px`;
    b.innerHTML = `<i></i><i></i>${label}<small>${cost}</small>`;
    stairs.appendChild(b);
  });
  // Fileira de studs: progresso ilustrativo
  const row = document.getElementById('studRow');
  for (let i = 0; i < 10; i++) { const s = document.createElement('span'); s.className = 'stud' + (i < 7 ? '' : ' off'); row.appendChild(s); }
  // Números atualizados a partir dos dados da rota (quando servido pelo servidor local)
  fetch('../../data/rota.json').then(r => r.json()).then(d => {
    const mult = d.redBricks.filter(b => b.multiplier);
    const total = mult.reduce((a, b) => a + b.cost, 0);
    document.getElementById('cMult').textContent = mult.length;
    document.getElementById('cStuds').textContent = String(+(total / 1e6).toFixed(1)).replace('.', ',') + 'M';
    document.getElementById('cTasks').textContent = d.stages.reduce((a, s) => a + s.tasks.length, 0);
  }).catch(() => {});
</script>
</body>
</html>
